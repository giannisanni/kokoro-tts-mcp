[project]
name = "kokoro-tts-mcp"
version = "0.2.0"
description = "A Model Context Protocol (MCP) server for Kokoro text-to-speech, with an optional OpenAI-compatible (kokoro-fastapi) remote backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "kokoro>=0.8.4",
    "mcp[cli]>=1.3.0",
    "soundfile>=0.13.1",
    "httpx>=0.27.0",
]
